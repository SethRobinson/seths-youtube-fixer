<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Seth's YouTube Fixer</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        font: 13px 'Roboto', Arial, sans-serif;
        min-width: 250px;
        box-sizing: border-box;
        padding: 12px 14px;
        margin: 0;
        background: #0f0f0f;
        color: #f1f1f1;
      }
      h1 { font-size: 14px; margin: 0 0 10px; }
      .row { margin: 8px 0; }
      .muted { opacity: 0.7; }
      a { color: #3ea6ff; cursor: pointer; display: inline-block; min-height: 44px; line-height: 44px; }
      @media (prefers-color-scheme: light) {
        body { background: #fff; color: #1c1c1e; }
        a { color: #065fd4; }
      }
    </style>
  </head>
  <body>
    <h1>Seth's YouTube Fixer</h1>
    <div id="status" class="row muted">Loading…</div>
    <div class="row"><a id="open-options">Settings</a></div>
    <script src="popup.js"></script>
  </body>
</html>
